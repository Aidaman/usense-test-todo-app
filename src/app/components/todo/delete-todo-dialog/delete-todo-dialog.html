<h2 mat-dialog-title>Delete Todo</h2>

<mat-dialog-content>
  <p>
    Are you sure that you want to delete this todo?
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button (click)="onDelete()" class="delete-button" mat-flat-button>
    Delete
  </button>
</mat-dialog-actions>
