<header class="header">
  <h2 class="header__title">
    {{ 'а Todo App' | titlecase }}
  </h2>

  <div class="header__filters">
    <mat-button-toggle-group
      name="completed"
      [hideSingleSelectionIndicator]="true"
    >
      @for (status of statusFilterEnumEntries; track status) {
        <mat-button-toggle
          [value]="status"
          (change)="onStatusFilterChange(status)"
        >{{ status | titlecase }}
        </mat-button-toggle>
      }
    </mat-button-toggle-group>
    <mat-button-toggle-group
      name="completed"
      [hideSingleSelectionIndicator]="true"
    >
      @for (priority of priorityFilterEnumEntries; track priority) {
        <mat-button-toggle
          [value]="priority"
          (change)="onPriorityFilterChange(priority)"
        >{{ priority | titlecase }}
        </mat-button-toggle>
      }
    </mat-button-toggle-group>
  </div>

  <div class="header__actions">
    <button mat-button (click)="onAddTodo()">
      <mat-icon>add</mat-icon>
      Create Todo
    </button>
  </div>
</header>
